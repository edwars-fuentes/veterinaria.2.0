spring.application.name=registro

# Conexión a MySQL (Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/registro
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jwt.secret=ClaveSuperSecretaVeterinariaSanMarcos2026Segura123456
app.jwt.expiration-ms=86400000

# JPA / Hibernate (Flyway crea/modifica tablas; Hibernate valida)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del microservicio
server.port=8082

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion